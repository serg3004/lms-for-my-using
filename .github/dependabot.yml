version: 2
updates:
  # GitHub Actions — weekly, all grouped
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"

  # npm/pnpm monorepo workspace
  # Single root directory only: Dependabot auto-discovers every workspace
  # package.json (root, apps/api, apps/web, packages/shared) from the pnpm
  # workspace root and updates the shared pnpm-lock.yaml as one unit. Listing
  # apps/api or apps/web as separate `directories` entries makes Dependabot
  # try to scan a workspace from inside a subdirectory, which pnpm workspaces
  # don't support ("Dependabot should only update from the root workspace") —
  # every one of those per-directory update runs failed with
  # misconfigured_tooling for any package whose only manifest entry lives in
  # a subdirectory (e.g. turbo, vite, vitest, @axe-core/playwright), which is
  # why "npm_and_yarn ... Update #<id>" workflow runs kept failing in Actions
  # while the weekly grouped PRs still got created from the root scan alone.
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "globals"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "turbo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/cli"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/testing"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
    groups:
      workspace-prod:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      workspace-dev:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
