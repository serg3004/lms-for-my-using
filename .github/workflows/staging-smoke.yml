name: Staging smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  role-based-smoke:
    name: Role-based staging smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      API_URL: ${{ vars.STAGING_API_URL }}
      WEB_URL: ${{ vars.STAGING_WEB_URL }}
      STAGING_SMOKE_ORGANIZATION: ${{ secrets.STAGING_SMOKE_ORGANIZATION }}
      STAGING_SMOKE_ADMIN_EMAIL: ${{ secrets.STAGING_SMOKE_ADMIN_EMAIL }}
      STAGING_SMOKE_ADMIN_PASSWORD: ${{ secrets.STAGING_SMOKE_ADMIN_PASSWORD }}
      STAGING_SMOKE_MANAGER_EMAIL: ${{ secrets.STAGING_SMOKE_MANAGER_EMAIL }}
      STAGING_SMOKE_MANAGER_PASSWORD: ${{ secrets.STAGING_SMOKE_MANAGER_PASSWORD }}
      STAGING_SMOKE_INSTRUCTOR_EMAIL: ${{ secrets.STAGING_SMOKE_INSTRUCTOR_EMAIL }}
      STAGING_SMOKE_INSTRUCTOR_PASSWORD: ${{ secrets.STAGING_SMOKE_INSTRUCTOR_PASSWORD }}
      STAGING_SMOKE_LEARNER_EMAIL: ${{ secrets.STAGING_SMOKE_LEARNER_EMAIL }}
      STAGING_SMOKE_LEARNER_PASSWORD: ${{ secrets.STAGING_SMOKE_LEARNER_PASSWORD }}
      STAGING_SMOKE_OUT_OF_TEAM_USER_ID: ${{ secrets.STAGING_SMOKE_OUT_OF_TEAM_USER_ID }}
      STAGING_SMOKE_UNASSIGNED_COURSE_ID: ${{ secrets.STAGING_SMOKE_UNASSIGNED_COURSE_ID }}
      STAGING_SMOKE_FOREIGN_USER_ID: ${{ secrets.STAGING_SMOKE_FOREIGN_USER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run role-based staging smoke
        run: bash scripts/smoke-staging.sh
