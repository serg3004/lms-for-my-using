name: Capture dependency audit diagnostics

on:
  push:
    branches:
      - agent/stage-brace-expansion-audit-20260930

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/stage-brace-expansion-audit-20260930
      - name: Skip if diagnostics already captured
        id: guard
        run: |
          if [ -f .audit-debug.json ]; then
            echo "captured=true" >> "$GITHUB_OUTPUT"
          else
            echo "captured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.guard.outputs.captured == 'false'
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.captured == 'false'
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.guard.outputs.captured == 'false'
        run: pnpm install --frozen-lockfile
      - name: Capture current audit JSON
        if: steps.guard.outputs.captured == 'false'
        run: pnpm audit --json --audit-level high > .audit-debug.json || true
      - name: Commit diagnostics
        if: steps.guard.outputs.captured == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .audit-debug.json
          git commit -m "chore: capture dependency audit diagnostics"
          git push origin HEAD:agent/stage-brace-expansion-audit-20260930
