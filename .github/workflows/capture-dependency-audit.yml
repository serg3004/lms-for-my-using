name: Regenerate lockfile for js-yaml audit fix

on:
  push:
    branches:
      - agent/stage-brace-expansion-audit-20260930

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/stage-brace-expansion-audit-20260930
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only
      - name: Verify patched js-yaml resolution
        run: |
          set -euo pipefail
          if grep -q 'js-yaml@5\.2\.3' pnpm-lock.yaml || grep -q 'js-yaml@5\.3\.0' pnpm-lock.yaml; then
            echo 'Vulnerable js-yaml 5.x resolution is still present'
            exit 1
          fi
      - name: Verify dependency audit
        run: |
          pnpm install --frozen-lockfile
          mkdir -p security-audit-artifacts
          pnpm audit --json --audit-level high > security-audit-artifacts/dependency-audit.json
          node scripts/check-dependency-audit.mjs security-audit-artifacts/dependency-audit.json
      - name: Commit regenerated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml already up to date'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh js-yaml transitive resolution"
          git push origin HEAD:agent/stage-brace-expansion-audit-20260930
