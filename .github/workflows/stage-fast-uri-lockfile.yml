name: Stage fast-uri lockfile regeneration

on:
  push:
    branches:
      - agent/stage-fast-uri-lockfile-20260929

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --force
      - name: Verify manifest is unchanged
        run: git diff --exit-code -- package.json
      - name: Verify vulnerable fast-uri resolution is gone
        run: |
          set -euo pipefail
          if grep -q 'fast-uri: 4\.1\.3' pnpm-lock.yaml; then
            echo 'fast-uri 4.1.3 is still referenced by the dependency graph'
            exit 1
          fi
      - name: Commit regenerated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml did not change"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh lockfile for fast-uri security fix"
          git push origin HEAD:agent/stage-fast-uri-lockfile-20260929
