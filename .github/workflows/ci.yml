name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

env:
  PRISMA_GENERATE_SKIP_AUTOINSTALL: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect dependency audit report
        id: dependency-audit
        continue-on-error: true
        run: |
          mkdir -p security-audit-artifacts
          pnpm audit --json --audit-level high > security-audit-artifacts/dependency-audit.json

      - name: Collect code-hygiene report
        id: code-hygiene
        continue-on-error: true
        run: pnpm security:hygiene security-audit-artifacts/code-hygiene.json

      - name: Upload security audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-audit-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce dependency and static-security gates
        if: always()
        run: |
          node scripts/check-dependency-audit.mjs security-audit-artifacts/dependency-audit.json
          test "${{ steps.dependency-audit.outcome }}" = "success"
          test "${{ steps.code-hygiene.outcome }}" = "success"

      - name: Validate security waivers
        run: node scripts/validate-security-waivers.mjs security-waivers.json "$RUNNER_TEMP/trivyignore"

      - name: Validate repository governance policy
        run: pnpm security:branch-protection:test

      - name: Security artifact tests
        run: pnpm security:artifacts:test

      - name: Lint
        run: pnpm --recursive lint

      - name: Generate Prisma Client
        run: pnpm --filter @lms/api prisma:generate

      - name: Typecheck
        run: pnpm --recursive typecheck

      - name: Tests
        run: pnpm --recursive test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/api/coverage/
            apps/web/coverage/
            packages/shared/coverage/
          if-no-files-found: error
          retention-days: 30

      - name: Staging smoke script tests
        run: bash scripts/smoke-staging.test.sh

      - name: Production migration check tests
        run: pnpm migration:production:check:test

      - name: Apply database migrations
        run: pnpm --filter @lms/api prisma:migrate:deploy

      - name: Run API database integration tests
        run: pnpm --filter @lms/api test:integration:db

      - name: Build
        run: pnpm --recursive build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E
        run: pnpm test:e2e
        env:
          NODE_ENV: test
          JWT_SECRET: e2e-only-jwt-secret-at-least-32-characters

      - name: Accessibility baseline
        run: pnpm test:a11y
        env:
          NODE_ENV: test
          JWT_SECRET: e2e-only-jwt-secret-at-least-32-characters

      - name: Responsive visual matrix
        run: pnpm test:visual

      - name: Upload safe Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build API Docker image
        run: scripts/docker-build-retry.sh -f apps/api/Dockerfile -t lms-api:ci .

      - name: Build Web Docker image
        run: scripts/docker-build-retry.sh -f apps/web/Dockerfile -t lms-web:ci .

      - name: Scan API Docker image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy"
          -v "$RUNNER_TEMP/trivyignore:/trivyignore:ro"
          aquasec/trivy:latest image
          --exit-code 1
          --ignore-unfixed
          --severity HIGH,CRITICAL
          --ignorefile /trivyignore
          lms-api:ci

      - name: Scan Web Docker image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy"
          -v "$RUNNER_TEMP/trivyignore:/trivyignore:ro"
          aquasec/trivy:latest image
          --exit-code 1
          --ignore-unfixed
          --severity HIGH,CRITICAL
          --ignorefile /trivyignore
          lms-web:ci
