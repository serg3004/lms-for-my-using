name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # Started by update-visual-baselines.yml after its bot commit: the pull_request run for a
  # bot-authored commit waits for manual approval ("Action required"), so the required
  # "Analyze" check is produced by this dispatch instead.
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
