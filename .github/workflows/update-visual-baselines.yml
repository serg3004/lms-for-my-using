name: Update visual regression baselines

# Manual-only: regenerates apps/e2e/visual-tests/*-snapshots/*.png on the same
# ubuntu-latest Chromium build the "Checks" CI job uses, then pushes the result
# back to the branch that was dispatched. See apps/e2e/visual-tests/README.md.
#
# Baselines must be generated on the exact browser build CI installs -- a
# baseline captured on a different OS or Chromium version fails as noisy
# anti-aliasing/font-rendering diffs that are not real UI regressions. This
# workflow is the controlled, reviewable way to do that: it never runs on
# push/PR, only on an explicit human-triggered dispatch, and every resulting
# commit is visible in the branch's history for review before merge.
#
# The workflow refuses to run on main and refuses to regenerate baselines from
# a branch that does not contain current origin/main. Pull-request CI tests a
# virtual merge with current main; generating snapshots from a stale branch
# would therefore compare different source trees and produce misleading diffs.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-baselines:
    name: Regenerate baselines
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify branch is safe and up to date
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "::error::Visual baselines must be regenerated on a working branch, never directly on main."
            exit 1
          fi

          git fetch --quiet --no-tags origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            read -r ahead behind < <(git rev-list --left-right --count HEAD...origin/main)
            echo "::error::Branch ${GITHUB_REF_NAME} is ${behind} commit(s) behind origin/main. Sync with main before regenerating visual baselines."
            echo "HEAD=$(git rev-parse HEAD)"
            echo "origin/main=$(git rev-parse origin/main)"
            echo "ahead=${ahead} behind=${behind}"
            exit 1
          fi

          echo "Branch is based on current origin/main."
          echo "HEAD=$(git rev-parse HEAD)"
          echo "origin/main=$(git rev-parse origin/main)"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate visual baselines
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @lms/e2e exec playwright test --config playwright.visual.config.ts --update-snapshots 2>&1 | tee "$RUNNER_TEMP/visual-baseline.log"

      - name: Report baseline failure diagnostics
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const path = join(process.env.RUNNER_TEMP, 'visual-baseline.log');
          if (!existsSync(path)) process.exit(0);
          const tail = readFileSync(path, 'utf8').replace(/\u001b\[[0-9;]*m/g, '').slice(-24000);
          // GitHub truncates a single annotation near 4 KB. Keep each chunk smaller so
          // the final test summary survives a noisy Vite proxy log as well.
          const chunkSize = 3000;
          for (let offset = 0; offset < tail.length; offset += chunkSize) {
            const escaped = tail.slice(offset, offset + chunkSize).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.log(`::error title=Visual baseline failure details ${Math.floor(offset / chunkSize) + 1}::${escaped}`);
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n## Visual baseline failure\n\n\`\`\`text\n${tail}\n\`\`\`\n`);
          NODE

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/e2e/visual-tests/responsive-matrix.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "chore(e2e): regenerate visual baselines on ubuntu-latest Chromium"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: update-baselines-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
