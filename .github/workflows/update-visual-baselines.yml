name: Update visual regression baselines

# Manual-only: regenerates apps/e2e/visual-tests/*-snapshots/*.png (every spec's snapshot folder) inside the same pinned
# official Playwright image the "Visual regression" CI job uses (PR 471), then pushes the
# result back to the branch that was dispatched. See apps/e2e/visual-tests/README.md.
#
# Baselines must be generated on the exact browser build CI uses -- a
# baseline captured on a different OS or Chromium version fails as noisy
# anti-aliasing/font-rendering diffs that are not real UI regressions. This
# workflow is the controlled, reviewable way to do that: it never runs on
# push/PR, only on an explicit human-triggered dispatch, and every resulting
# commit is visible in the branch's history for review before merge.
#
# The workflow refuses to run on main and refuses to regenerate baselines from
# a branch that does not contain current origin/main. Pull-request CI tests a
# virtual merge with current main; generating snapshots from a stale branch
# would therefore compare different source trees and produce misleading diffs.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  verify:
    name: Verify branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify branch is safe and up to date
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "::error::Visual baselines must be regenerated on a working branch, never directly on main."
            exit 1
          fi

          git fetch --quiet --no-tags origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            read -r ahead behind < <(git rev-list --left-right --count HEAD...origin/main)
            echo "::error::Branch ${GITHUB_REF_NAME} is ${behind} commit(s) behind origin/main. Sync with main before regenerating visual baselines."
            echo "HEAD=$(git rev-parse HEAD)"
            echo "origin/main=$(git rev-parse origin/main)"
            echo "ahead=${ahead} behind=${behind}"
            exit 1
          fi

          echo "Branch is based on current origin/main."
          echo "HEAD=$(git rev-parse HEAD)"
          echo "origin/main=$(git rev-parse origin/main)"

  generate:
    name: Generate baselines in the Playwright image
    runs-on: ubuntu-latest
    needs: [verify]
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate visual baselines
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @lms/e2e exec playwright test --config playwright.visual.config.ts --update-snapshots 2>&1 | tee "$RUNNER_TEMP/visual-baseline.log"

      - name: Report baseline failure diagnostics
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const path = join(process.env.RUNNER_TEMP, 'visual-baseline.log');
          if (!existsSync(path)) process.exit(0);
          const tail = readFileSync(path, 'utf8').replace(/\u001b\[[0-9;]*m/g, '').slice(-24000);
          // GitHub truncates a single annotation near 4 KB. Keep each chunk smaller so
          // the final test summary survives a noisy Vite proxy log as well.
          const chunkSize = 3000;
          for (let offset = 0; offset < tail.length; offset += chunkSize) {
            const escaped = tail.slice(offset, offset + chunkSize).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.log(`::error title=Visual baseline failure details ${Math.floor(offset / chunkSize) + 1}::${escaped}`);
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n## Visual baseline failure\n\n\`\`\`text\n${tail}\n\`\`\`\n`);
          NODE

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: apps/e2e/visual-tests/*-snapshots/
          if-no-files-found: error
          retention-days: 3

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: update-baselines-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  commit:
    name: Commit baselines
    runs-on: ubuntu-latest
    needs: [generate]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download regenerated baselines
        uses: actions/download-artifact@v8
        with:
          name: visual-baselines
          path: apps/e2e/visual-tests/

      - name: Commit updated baselines
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/e2e/visual-tests/*-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "chore(e2e): regenerate visual baselines in the Playwright image"
          git push origin HEAD:${{ github.ref_name }}
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not start CI. Start it explicitly on the branch so the
      # new baseline commit gets the same required checks as any other commit (workflow_dispatch
      # started with GITHUB_TOKEN is allowed to trigger a run).
      - name: Run CI on the baseline commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.ref_name }}"
