name: Verify brace-expansion audit fix

on:
  push:
    branches:
      - agent/stage-brace-expansion-audit-20260930

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize task branch checkout
        run: git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Agent preflight
        id: preflight
        continue-on-error: true
        run: pnpm agent:preflight
      - name: Collect dependency audit report
        run: |
          mkdir -p security-audit-artifacts
          pnpm audit --json --audit-level high > security-audit-artifacts/dependency-audit.json || true
      - name: Enforce dependency audit gate
        run: node scripts/check-dependency-audit.mjs security-audit-artifacts/dependency-audit.json
      - name: Enforce preflight result
        if: steps.preflight.outcome != 'success'
        run: exit 1
