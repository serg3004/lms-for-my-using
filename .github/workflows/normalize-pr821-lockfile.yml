name: Normalize PR 821 lockfile

on:
  push:
    branches:
      - dependabot/npm_and_yarn/workspace-prod-063a8a365e

permissions:
  contents: write

jobs:
  normalize-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dependabot/npm_and_yarn/workspace-prod-063a8a365e
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Update only PR 821 production dependencies
        run: |
          set -euo pipefail
          pnpm --filter @lms/api update @aws-sdk/client-s3@3.1140.0 @aws-sdk/s3-request-presigner@3.1140.0 --lockfile-only
          pnpm --filter @lms/web update react-i18next@17.0.15 --lockfile-only
      - name: Verify manifests unchanged
        run: git diff --exit-code -- apps/api/package.json apps/web/package.json
      - name: Verify patched fast-uri remains resolved
        run: |
          set -euo pipefail
          if grep -q 'fast-uri: 4\.1\.3' pnpm-lock.yaml; then
            echo 'fast-uri 4.1.3 reappeared in the dependency graph'
            exit 1
          fi
      - name: Remove staging workflow and commit lockfile
        run: |
          set -euo pipefail
          git rm .github/workflows/normalize-pr821-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): normalize workspace-prod lockfile"
          git push origin HEAD:dependabot/npm_and_yarn/workspace-prod-063a8a365e
