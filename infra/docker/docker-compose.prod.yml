# Production Docker Compose
# Usage: docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env up -d
#
# Before first run:
#   cp infra/docker/.env.example infra/docker/.env
#   # Edit .env with real secrets
#   docker compose -f infra/docker/docker-compose.prod.yml build
#   docker compose -f infra/docker/docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms}
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lms_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms_user} -d ${POSTGRES_DB:-lms}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: lms-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      TRUST_PROXY: loopback,linklocal,uniquelocal
      # Required by apps/api/src/config/env.ts in production (Prometheus bearer auth).
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?Set METRICS_BEARER_TOKEN in .env (generate with openssl rand -hex 32)}
      # Required in production unless ALLOW_IN_MEMORY_RATE_LIMIT=true. This compose
      # stack runs a single API instance, so in-memory rate limiting is a safe default;
      # set REDIS_URL below to opt into distributed, restart-safe rate limiting instead.
      REDIS_URL: ${REDIS_URL:-}
      ALLOW_IN_MEMORY_RATE_LIMIT: ${ALLOW_IN_MEMORY_RATE_LIMIT:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional S3-compatible storage. Leave unset in .env to disable file uploads.
      # S3_REGION, S3_FILE_ORIGIN, S3_PRESIGNED_TTL_SECONDS and S3_ORPHAN_RETENTION_DAYS
      # are intentionally NOT passed through: their call sites use `?? default` on the
      # raw value, so an empty string (Compose's fallback for an unset `${VAR:-}`) would
      # silently override the default instead of falling back to it. Set them directly
      # in this file if you ever need non-default values.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      MALWARE_SCANNER_URL: ${MALWARE_SCANNER_URL:-}
      MALWARE_SCANNER_CALLBACK_SECRET: ${MALWARE_SCANNER_CALLBACK_SECRET:-}
    networks:
      - lms_internal
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: lms-web
    restart: unless-stopped
    environment:
      API_HOST: api
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - lms_internal
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

networks:
  lms_internal:
    driver: bridge

volumes:
  postgres_data:
