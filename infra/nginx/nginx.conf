server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Railway terminates TLS before this container. HSTS is deliberately emitted
    # at the public web ingress; browsers ignore it on plain HTTP development URLs.
    include /etc/nginx/snippets/security-headers.conf;

    # The Railway edge normally redirects HTTP. Keep the policy explicit at the
    # application ingress as well when the edge forwards an HTTP request.
    if ($http_x_forwarded_proto = "http") {
        return 308 https://$host$request_uri;
    }

    # Static assets — long cache
    location ~* \.(js|css|woff2?|ico|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header directives are inherited only when this block has none of its own.
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Proxy API requests to the backend service
    # API_UPSTREAM_URL defaults to Railway private networking:
    # http://api.railway.internal:3000
    # Keep the API on private networking so this proxy is its only public entry point.
    location /api/ {
        proxy_pass ${API_UPSTREAM_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace any client-supplied chain: the API only trusts this proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The public ingress owns the browser policy and must not combine it with
        # the API's stricter direct-response CSP.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    # SPA fallback — all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
