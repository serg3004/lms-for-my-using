<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LearnSpace — Оформление</title><style>
:root{--bg:#f4f7fb;--s:#fff;--soft:#f8fafc;--t:#172033;--m:#6b7280;--b:#e3e8ef;--p:#4f46e5;--ps:#eef2ff;--ok:#0f9f6e;--oks:#e9f8f2;--w:#d97706;--ws:#fff7e8;--side:#111827}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr;grid-template-rows:74px 1fr}.sidebar{grid-row:1/3;background:var(--side);color:#fff;padding:22px 18px}.brand{display:flex;gap:10px;align-items:center;padding-bottom:28px}.mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--p);font-weight:900}.brand small{display:block;color:#9ca3af}.nav{display:grid;gap:7px}.nav a{color:#cbd5e1;text-decoration:none;padding:12px;border-radius:11px}.nav a.active,.nav a:hover{background:rgba(129,140,248,.16);color:#fff}
.header{grid-column:2;background:#fff;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 26px}.crumbs{color:var(--m);font-size:14px}.actions{margin-left:auto;display:flex;gap:10px;align-items:center}.chip{height:40px;border:1px solid var(--b);background:#fff;border-radius:11px;padding:0 12px}.lang{position:relative}.menu{position:absolute;right:0;top:46px;min-width:150px;background:#fff;border:1px solid var(--b);border-radius:13px;padding:7px;display:none;box-shadow:0 12px 30px rgba(0,0,0,.12);z-index:20}.menu.open{display:block}.opt{width:100%;border:0;background:transparent;text-align:left;padding:9px;border-radius:8px}.opt:hover,.opt.active{background:var(--ps);color:var(--p)}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#f59e0b;color:#fff;font-weight:800}
main{grid-column:2;padding:28px}.content{max-width:1360px;margin:auto}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.eyebrow{color:var(--p);font-size:12px;font-weight:800;text-transform:uppercase;margin-bottom:7px}h1{margin:0;font-size:36px}.sub{color:var(--m);margin:8px 0 0}.btn{border:1px solid var(--b);background:#fff;border-radius:11px;padding:10px 13px;font-weight:800}.btn.primary{background:var(--p);border-color:var(--p);color:#fff}.card{background:#fff;border:1px solid var(--b);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(23,32,51,.05)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{border:1px solid var(--b);background:#fff;border-radius:11px;padding:10px 12px}.toolbar input{flex:1;min-width:220px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid var(--b)}.table th{color:var(--m);font-size:12px;text-transform:uppercase}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--ps);color:var(--p);font-size:12px;font-weight:800}.badge.ok{background:var(--oks);color:var(--ok)}.badge.warn{background:var(--ws);color:var(--w)}.field{display:grid;gap:7px;margin-bottom:14px}.field input,.field textarea,.field select{border:1px solid var(--b);border-radius:11px;padding:11px}.preview{border:1px solid var(--b);border-radius:18px;overflow:hidden}.preview-top{height:160px;background:linear-gradient(135deg,var(--p),#7c3aed)}.preview-body{padding:18px}.item{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--b);border-radius:14px;margin-bottom:10px}.index{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--ps);color:var(--p);font-weight:800}
@media(max-width:1000px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{display:none}.header,main{grid-column:1}}@media(max-width:620px){.grid{grid-template-columns:1fr}.head{flex-direction:column}.table-wrap{overflow:auto}}
</style></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="mark">L</div><div><strong>LearnSpace</strong><small data-i18n="brand">Администрирование</small></div></div><nav class="nav">
<a class="" href="#" data-i18n="dashboard">Панель</a><a class="" href="#" data-i18n="users">Пользователи</a><a class="" href="#" data-i18n="roles">Роли</a><a class="" href="#" data-i18n="org">Организация</a><a class="active" href="#" data-i18n="theme">Оформление</a><a class="" href="#" data-i18n="courses">Курсы</a><a class="" href="#" data-i18n="lessons">Уроки</a><a class="" href="#" data-i18n="materials">Материалы</a></nav></aside>
<header class="header"><div class="crumbs" data-i18n="crumbs">Администрирование</div><div class="actions">
<div class="lang"><button class="chip" id="languageButton">RU</button><div class="menu" id="languageMenu">
<button class="opt" data-lang="ru">Русский</button><button class="opt" data-lang="en">English</button>
<button class="opt" data-lang="kk">Қазақша</button><button class="opt" data-lang="zh">中文</button></div></div>
<button class="chip">🔔</button><div class="avatar">АД</div></div></header><main><div class="content"><section class="head"><div><div class="eyebrow" data-i18n="eyebrow">Брендинг платформы</div><h1 data-i18n="title">Настройки оформления</h1><p class="sub" data-i18n="sub">Настройте логотип, цвета и внешний вид интерфейса.</p></div><button class="btn primary" id="saveButton" data-i18n="save">Сохранить</button></section><section class="two"><article class="card"><div class="field"><label data-i18n="name">Название платформы</label><input id="platformName" value="LearnSpace"></div><div class="field"><label data-i18n="primary">Основной цвет</label><input id="colorInput" type="color" value="#4f46e5"></div><div class="field"><label data-i18n="logo">Логотип</label><input id="logoInput" type="file"></div><button class="btn" id="resetButton" data-i18n="reset">Сбросить</button></article><article class="preview"><div class="preview-top" id="themePreview"></div><div class="preview-body"><h3 id="previewName">LearnSpace</h3><p data-i18n="preview">Предварительный просмотр оформления платформы.</p><button class="btn primary" data-i18n="action">Основное действие</button></div></article></section></div></main></div>
<script>const translations={"ru": {"brand": "Администрирование", "dashboard": "Панель", "users": "Пользователи", "roles": "Роли", "org": "Организация", "theme": "Оформление", "courses": "Курсы", "lessons": "Уроки", "materials": "Материалы", "crumbs": "Администрирование / Оформление", "eyebrow": "Брендинг платформы", "title": "Настройки оформления", "sub": "Настройте логотип, цвета и внешний вид интерфейса.", "save": "Сохранить", "name": "Название платформы", "primary": "Основной цвет", "logo": "Логотип", "reset": "Сбросить", "preview": "Предварительный просмотр оформления платформы.", "action": "Основное действие"}, "en": {"brand": "Administration", "dashboard": "Dashboard", "users": "Users", "roles": "Roles", "org": "Organization", "theme": "Appearance", "courses": "Courses", "lessons": "Lessons", "materials": "Materials", "crumbs": "Administration / Appearance", "eyebrow": "Platform branding", "title": "Appearance settings", "sub": "Configure logo, colors and interface appearance.", "save": "Save", "name": "Platform name", "primary": "Primary color", "logo": "Logo", "reset": "Reset", "preview": "Preview of the platform appearance.", "action": "Primary action"}, "kk": {"brand": "Әкімшілік", "dashboard": "Панель", "users": "Пайдаланушылар", "roles": "Рөлдер", "org": "Ұйым", "theme": "Безендіру", "courses": "Курстар", "lessons": "Сабақтар", "materials": "Материалдар", "crumbs": "Әкімшілік / Безендіру", "eyebrow": "Платформа брендингі", "title": "Безендіру параметрлері", "sub": "Логотипті, түстерді және интерфейс көрінісін реттеңіз.", "save": "Сақтау", "name": "Платформа атауы", "primary": "Негізгі түс", "logo": "Логотип", "reset": "Қалпына келтіру", "preview": "Платформа безендіруінің алдын ала көрінісі.", "action": "Негізгі әрекет"}, "zh": {"brand": "管理后台", "dashboard": "面板", "users": "用户", "roles": "角色", "org": "组织", "theme": "外观", "courses": "课程", "lessons": "课时", "materials": "资料", "crumbs": "管理 / 外观", "eyebrow": "平台品牌", "title": "外观设置", "sub": "配置标志、颜色和界面外观。", "save": "保存", "name": "平台名称", "primary": "主色", "logo": "标志", "reset": "重置", "preview": "平台外观预览。", "action": "主要操作"}};
const labels={ru:"RU",en:"EN",kk:"KK",zh:"ZH"};
const languageButton=document.getElementById("languageButton"),languageMenu=document.getElementById("languageMenu");
function setLanguage(lang){const d=translations[lang]||translations.ru;document.documentElement.lang=lang;languageButton.textContent=labels[lang];document.querySelectorAll("[data-i18n]").forEach(e=>{if(d[e.dataset.i18n])e.textContent=d[e.dataset.i18n]});document.querySelectorAll("[data-ph]").forEach(e=>{if(d[e.dataset.ph])e.placeholder=d[e.dataset.ph]});document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));localStorage.setItem("lms-prototype-language",lang);languageMenu.classList.remove("open")}
languageButton.addEventListener("click",e=>{e.stopPropagation();languageMenu.classList.toggle("open")});document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>setLanguage(b.dataset.lang)));document.addEventListener("click",e=>{if(!e.target.closest(".lang"))languageMenu.classList.remove("open")});
const nameInput=document.getElementById("platformName"),colorInput=document.getElementById("colorInput");nameInput.oninput=()=>document.getElementById("previewName").textContent=nameInput.value;colorInput.oninput=()=>document.getElementById("themePreview").style.background=`linear-gradient(135deg,${colorInput.value},#7c3aed)`;document.getElementById("saveButton").onclick=()=>alert("Прототип: настройки сохранены.");document.getElementById("resetButton").onclick=()=>{nameInput.value="LearnSpace";colorInput.value="#4f46e5";document.getElementById("previewName").textContent="LearnSpace";};setLanguage(localStorage.getItem("lms-prototype-language")||"ru");</script></body></html>
