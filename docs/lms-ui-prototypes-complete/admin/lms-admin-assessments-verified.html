<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LearnSpace — Тесты</title><style>
:root{--bg:#f4f7fb;--s:#fff;--soft:#f8fafc;--t:#172033;--m:#6b7280;--b:#e3e8ef;--p:#4f46e5;--ps:#eef2ff;--ok:#0f9f6e;--oks:#e9f8f2;--w:#d97706;--ws:#fff7e8;--side:#111827}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr;grid-template-rows:74px 1fr}.sidebar{grid-row:1/3;background:var(--side);color:#fff;padding:22px 18px}.brand{display:flex;gap:10px;align-items:center;padding-bottom:28px}.mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--p);font-weight:900}.brand small{display:block;color:#9ca3af}.nav{display:grid;gap:7px}.nav a{color:#cbd5e1;text-decoration:none;padding:12px;border-radius:11px}.nav a.active,.nav a:hover{background:rgba(129,140,248,.16);color:#fff}
.header{grid-column:2;background:#fff;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 26px}.crumbs{color:var(--m);font-size:14px}.actions{margin-left:auto;display:flex;gap:10px;align-items:center}.chip{height:40px;border:1px solid var(--b);background:#fff;border-radius:11px;padding:0 12px}.lang{position:relative}.menu{position:absolute;right:0;top:46px;min-width:150px;background:#fff;border:1px solid var(--b);border-radius:13px;padding:7px;display:none;box-shadow:0 12px 30px rgba(0,0,0,.12);z-index:20}.menu.open{display:block}.opt{width:100%;border:0;background:transparent;text-align:left;padding:9px;border-radius:8px}.opt:hover,.opt.active{background:var(--ps);color:var(--p)}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#f59e0b;color:#fff;font-weight:800}
main{grid-column:2;padding:28px}.content{max-width:1360px;margin:auto}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.eyebrow{color:var(--p);font-size:12px;font-weight:800;text-transform:uppercase;margin-bottom:7px}h1{margin:0;font-size:36px}.sub{color:var(--m);margin:8px 0 0}.btn{border:1px solid var(--b);background:#fff;border-radius:11px;padding:10px 13px;font-weight:800}.btn.primary{background:var(--p);border-color:var(--p);color:#fff}.card{background:#fff;border:1px solid var(--b);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(23,32,51,.05)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--b);border-radius:15px;padding:17px}.stat strong{display:block;font-size:27px}.stat span{color:var(--m);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{border:1px solid var(--b);background:#fff;border-radius:11px;padding:10px 12px}.toolbar input{flex:1;min-width:220px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid var(--b)}.table th{color:var(--m);font-size:12px;text-transform:uppercase}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--ps);color:var(--p);font-size:12px;font-weight:800}.badge.ok{background:var(--oks);color:var(--ok)}.badge.warn{background:var(--ws);color:var(--w)}.field{display:grid;gap:7px;margin-bottom:14px}.field input,.field textarea,.field select{border:1px solid var(--b);border-radius:11px;padding:11px}.item{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--b);border-radius:14px;margin-bottom:10px}.index{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--ps);color:var(--p);font-weight:800}.bar{height:9px;background:#edf0f5;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--p)}
@media(max-width:1000px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{display:none}.header,main{grid-column:1}}@media(max-width:620px){.stats,.grid{grid-template-columns:1fr}.head{flex-direction:column}.table-wrap{overflow:auto}}
</style></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="mark">L</div><div><strong>LearnSpace</strong><small data-i18n="brand">Администрирование</small></div></div><nav class="nav">
<a class="" href="#" data-i18n="n1">Панель</a><a class="" href="#" data-i18n="n2">Пользователи</a><a class="" href="#" data-i18n="n3">Курсы</a><a class="active" href="#" data-i18n="n4">Тесты</a><a class="" href="#" data-i18n="n5">Назначения</a><a class="" href="#" data-i18n="n6">Результаты</a>
</nav></aside><header class="header"><div class="crumbs" data-i18n="crumbs"></div><div class="actions">
<div class="lang"><button class="chip" id="languageButton">RU</button><div class="menu" id="languageMenu">
<button class="opt" data-lang="ru">Русский</button><button class="opt" data-lang="en">English</button>
<button class="opt" data-lang="kk">Қазақша</button><button class="opt" data-lang="zh">中文</button></div></div>
<button class="chip">🔔</button><div class="avatar">АД</div></div></header><main><div class="content"><section class="head"><div><div class="eyebrow" data-i18n="eyebrow">Контроль знаний</div><h1 data-i18n="title">Тесты</h1><p class="sub" data-i18n="sub">Создавайте и публикуйте проверки знаний.</p></div><button class="btn primary" id="createButton" data-i18n="create">Создать тест</button></section><div class="toolbar"><input id="searchInput" data-ph="search" placeholder="Найти тест"><select id="statusFilter"><option value="all" data-i18n="all">Все статусы</option><option value="published" data-i18n="published">Опубликован</option><option value="draft" data-i18n="draft">Черновик</option></select></div><section class="card table-wrap"><table class="table"><thead><tr><th data-i18n="name">Название</th><th data-i18n="questions">Вопросы</th><th data-i18n="status">Статус</th><th data-i18n="attempts">Попытки</th></tr></thead><tbody id="rows"><tr data-name="техника безопасности" data-status="published"><td>Техника безопасности</td><td>10</td><td><span class="badge ok" data-i18n="published">Опубликован</span></td><td>84</td></tr><tr data-name="корпоративные стандарты" data-status="draft"><td>Корпоративные стандарты</td><td>8</td><td><span class="badge warn" data-i18n="draft">Черновик</span></td><td>0</td></tr></tbody></table></section></div></main></div>
<script>const translations={"ru": {"brand": "Администрирование", "n1": "Панель", "n2": "Пользователи", "n3": "Курсы", "n4": "Тесты", "n5": "Назначения", "n6": "Результаты", "crumbs": "Администрирование / Тесты", "eyebrow": "Контроль знаний", "title": "Тесты", "sub": "Создавайте и публикуйте проверки знаний.", "create": "Создать тест", "search": "Найти тест", "all": "Все статусы", "published": "Опубликован", "draft": "Черновик", "name": "Название", "questions": "Вопросы", "status": "Статус", "attempts": "Попытки"}, "en": {"brand": "Administration", "n1": "Dashboard", "n2": "Users", "n3": "Courses", "n4": "Assessments", "n5": "Assignments", "n6": "Results", "crumbs": "Administration / Assessments", "eyebrow": "Knowledge control", "title": "Assessments", "sub": "Create and publish knowledge checks.", "create": "Create assessment", "search": "Find assessment", "all": "All statuses", "published": "Published", "draft": "Draft", "name": "Name", "questions": "Questions", "status": "Status", "attempts": "Attempts"}, "kk": {"brand": "Әкімшілік", "n1": "Панель", "n2": "Пайдаланушылар", "n3": "Курстар", "n4": "Тесттер", "n5": "Тапсырмалар", "n6": "Нәтижелер", "crumbs": "Әкімшілік / Тесттер", "eyebrow": "Білімді бақылау", "title": "Тесттер", "sub": "Білімді тексеруді жасаңыз және жариялаңыз.", "create": "Тест құру", "search": "Тестті табу", "all": "Барлық күйлер", "published": "Жарияланған", "draft": "Жоба", "name": "Атауы", "questions": "Сұрақтар", "status": "Күй", "attempts": "Әрекеттер"}, "zh": {"brand": "管理后台", "n1": "面板", "n2": "用户", "n3": "课程", "n4": "测试", "n5": "任务", "n6": "结果", "crumbs": "管理 / 测试", "eyebrow": "知识控制", "title": "测试", "sub": "创建并发布知识测试。", "create": "创建测试", "search": "搜索测试", "all": "所有状态", "published": "已发布", "draft": "草稿", "name": "名称", "questions": "问题", "status": "状态", "attempts": "尝试次数"}};
const labels={ru:"RU",en:"EN",kk:"KK",zh:"ZH"};
const languageButton=document.getElementById("languageButton"),languageMenu=document.getElementById("languageMenu");
function setLanguage(lang){const d=translations[lang]||translations.ru;document.documentElement.lang=lang;languageButton.textContent=labels[lang];document.querySelectorAll("[data-i18n]").forEach(e=>{if(d[e.dataset.i18n])e.textContent=d[e.dataset.i18n]});document.querySelectorAll("[data-ph]").forEach(e=>{if(d[e.dataset.ph])e.placeholder=d[e.dataset.ph]});document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));localStorage.setItem("lms-prototype-language",lang);languageMenu.classList.remove("open")}
languageButton.addEventListener("click",e=>{e.stopPropagation();languageMenu.classList.toggle("open")});document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>setLanguage(b.dataset.lang)));document.addEventListener("click",e=>{if(!e.target.closest(".lang"))languageMenu.classList.remove("open")});
const q=document.getElementById("searchInput"),f=document.getElementById("statusFilter"),rows=[...document.querySelectorAll("#rows tr")];function run(){rows.forEach(r=>r.style.display=(r.dataset.name.includes(q.value.toLowerCase())&&(f.value==="all"||r.dataset.status===f.value))?"table-row":"none")}q.oninput=run;f.onchange=run;document.getElementById("createButton").onclick=()=>alert("Прототип: создание теста.");setLanguage(localStorage.getItem("lms-prototype-language")||"ru");</script></body></html>
