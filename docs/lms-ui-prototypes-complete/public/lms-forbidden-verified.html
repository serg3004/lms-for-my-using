<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LearnSpace — 403</title><style>
:root{--bg:#f4f7fb;--s:#fff;--t:#172033;--m:#6b7280;--b:#e3e8ef;--p:#4f46e5;--ps:#eef2ff;--ok:#0f9f6e;--oks:#e9f8f2;--w:#d97706;--ws:#fff7e8;--d:#dc2626;--ds:#fef2f2;--side:#111827}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t)}button,input,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr;grid-template-rows:74px 1fr}.sidebar{grid-row:1/3;background:var(--side);color:#fff;padding:22px 18px}.brand{display:flex;gap:10px;align-items:center;padding-bottom:28px}.mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--p);font-weight:900}.brand small{display:block;color:#9ca3af}.nav{display:grid;gap:7px}.nav a{color:#cbd5e1;text-decoration:none;padding:12px;border-radius:11px}.nav a.active,.nav a:hover{background:rgba(129,140,248,.16);color:#fff}
.header{grid-column:2;background:#fff;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 26px;gap:12px}.crumbs{color:var(--m);font-size:14px}.head-actions{margin-left:auto;display:flex;gap:10px;align-items:center}.chip{height:40px;border:1px solid var(--b);background:#fff;border-radius:11px;padding:0 12px}.lang{position:relative}.menu{position:absolute;right:0;top:46px;min-width:150px;background:#fff;border:1px solid var(--b);border-radius:13px;padding:7px;display:none;box-shadow:0 12px 30px rgba(0,0,0,.12);z-index:20}.menu.open{display:block}.opt{width:100%;border:0;background:transparent;text-align:left;padding:9px;border-radius:8px}.opt:hover,.opt.active{background:var(--ps);color:var(--p)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#f59e0b;color:#fff;font-weight:800}
main{grid-column:2;padding:28px}.content{max-width:1360px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px}.eyebrow{color:var(--p);font-size:12px;font-weight:800;text-transform:uppercase;margin-bottom:7px}h1{margin:0;font-size:36px}.sub{color:var(--m);margin:8px 0 0}.btn{border:1px solid var(--b);background:#fff;border-radius:11px;padding:10px 13px;font-weight:800}.btn.primary{background:var(--p);border-color:var(--p);color:#fff}.card{background:#fff;border:1px solid var(--b);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(23,32,51,.05)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--b);border-radius:15px;padding:17px}.stat strong{display:block;font-size:27px}.stat span{color:var(--m);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{border:1px solid var(--b);background:#fff;border-radius:11px;padding:10px 12px}.toolbar input{flex:1;min-width:220px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid var(--b)}.table th{color:var(--m);font-size:12px;text-transform:uppercase}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--ps);color:var(--p);font-size:12px;font-weight:800}.badge.ok{background:var(--oks);color:var(--ok)}.badge.warn{background:var(--ws);color:var(--w)}
@media(max-width:950px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr 1fr}}@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{display:none}.header,main{grid-column:1}}@media(max-width:620px){.stats,.grid{grid-template-columns:1fr}.head{flex-direction:column}.table-wrap{overflow:auto}}
.page{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative}.top{position:absolute;top:24px;right:24px}.panel{width:min(680px,100%);background:#fff;border:1px solid var(--b);border-radius:26px;padding:46px;text-align:center;box-shadow:0 24px 60px rgba(23,32,51,.1)}.code{font-size:130px;line-height:.8;font-weight:900;color:#fee2e2}.panel h1{font-size:36px}.panel p{color:var(--m);line-height:1.6}.actions{display:flex;justify-content:center;gap:10px}</style></head><body><div class="page"><div class="top">
<div class="lang"><button class="chip" id="languageButton">RU</button><div class="menu" id="languageMenu">
<button class="opt" data-lang="ru">Русский</button><button class="opt" data-lang="en">English</button>
<button class="opt" data-lang="kk">Қазақша</button><button class="opt" data-lang="zh">中文</button></div></div>
</div><main class="panel"><div class="code">403</div><h1 data-i18n="title">Доступ запрещён</h1><p data-i18n="text">У вашей учётной записи нет прав для просмотра этой страницы.</p><div class="actions"><button class="btn primary" id="homeButton" data-i18n="home">На главную</button><button class="btn" id="backButton" data-i18n="back">Назад</button></div></main></div><script>const translations={ru:{title:"Доступ запрещён",text:"У вашей учётной записи нет прав для просмотра этой страницы.",home:"На главную",back:"Назад"},en:{title:"Access denied",text:"Your account does not have permission to view this page.",home:"Go to dashboard",back:"Go back"},kk:{title:"Қолжетімділік жоқ",text:"Есептік жазбаңызда бұл бетті көруге құқық жоқ.",home:"Басты бетке",back:"Артқа"},zh:{title:"访问被拒绝",text:"您的账户无权查看此页面。",home:"返回首页",back:"返回"}};
const labels={ru:"RU",en:"EN",kk:"KK",zh:"ZH"};
const languageButton=document.getElementById("languageButton"),languageMenu=document.getElementById("languageMenu");
function setLanguage(lang){const d=translations[lang]||translations.ru;document.documentElement.lang=lang;languageButton.textContent=labels[lang];document.querySelectorAll("[data-i18n]").forEach(e=>{if(d[e.dataset.i18n])e.textContent=d[e.dataset.i18n]});document.querySelectorAll("[data-ph]").forEach(e=>{if(d[e.dataset.ph])e.placeholder=d[e.dataset.ph]});document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));localStorage.setItem("lms-prototype-language",lang);languageMenu.classList.remove("open")}
languageButton.addEventListener("click",e=>{e.stopPropagation();languageMenu.classList.toggle("open")});document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>setLanguage(b.dataset.lang)));document.addEventListener("click",e=>{if(!e.target.closest(".lang"))languageMenu.classList.remove("open")});
document.getElementById("homeButton").onclick=()=>alert("Прототип: главная.");document.getElementById("backButton").onclick=()=>alert("Прототип: назад.");setLanguage(localStorage.getItem("lms-prototype-language")||"ru");</script></body></html>
